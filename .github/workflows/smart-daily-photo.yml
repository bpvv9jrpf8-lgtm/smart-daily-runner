name: Smart Daily Public Photo Runner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smart-daily-photo.yml'
  schedule:
    - cron: '40 0,4,8,12,16,20 * * *'

permissions:
  contents: write

concurrency:
  group: smart-daily-public-photo-runner
  cancel-in-progress: false

jobs:
  publish-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout private Smart Daily source
        uses: actions/checkout@v4
        with:
          repository: bpvv9jrpf8-lgtm/smart-daily-automation
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-src
          persist-credentials: false

      - name: Validate secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          for name in OPENAI_API_KEY PEXELS_API_KEY PIXABAY_API_KEY CLOUDINARY_URL BUFFER_API_TOKEN BUFFER_CHANNEL_ID PRIVATE_REPO_TOKEN; do
            [ -n "${!name:-}" ] || { echo "$name missing"; exit 1; }
          done

      - name: Install runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests cloudinary
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core

      - name: Prepare public history
        run: |
          mkdir -p history
          touch history/used-photo-topics.txt history/used-buffer-topics.txt history/photo-source-log.txt
          if [ ! -s history/used-photo-topics.txt ] && [ -f private-src/used-photo-topics.txt ]; then cp private-src/used-photo-topics.txt history/used-photo-topics.txt; fi
          if [ ! -s history/used-buffer-topics.txt ] && [ -f private-src/used-buffer-topics.txt ]; then cp private-src/used-buffer-topics.txt history/used-buffer-topics.txt; fi
          if [ ! -s history/photo-source-log.txt ] && [ -f private-src/photo-source-log.txt ]; then cp private-src/photo-source-log.txt history/photo-source-log.txt; fi

      - name: Generate and publish Smart Daily photo
        env:
          RUNNER_ROOT: ${{ github.workspace }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          set -euo pipefail
          CLEAN_BUFFER_TOKEN="$(printf '%s' "$BUFFER_API_TOKEN" | sed 's/^BUFFER_API_TOKEN=//' | sed 's/^Bearer[[:space:]]*//' | tr -d '\r\n\t ')"
          export BUFFER_API_TOKEN="$CLEAN_BUFFER_TOKEN"
          python private-src/scripts/public_runner_photo.py

      - name: Save topic history in public runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/
          if git diff --cached --quiet; then
            echo 'No history changes to commit'
          else
            git commit -m 'Update Smart Daily photo history'
            git push
          fi
